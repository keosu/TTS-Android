name: Build and Release Android APK

permissions:
  contents: write

on:
  push:
    branches: [ main, master, 'feature/**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore from Secrets
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          echo "Keystore decoded from Secrets"
        else
          echo "No keystore secret found, using local keystore if exists"
        fi

    - name: Test and build Release APK
      run: ./gradlew testDebugUnitTest assembleRelease :edgeapp:lintDebug --no-daemon

    - name: Upload Edge TTS Release APK
      uses: actions/upload-artifact@v4
      with:
        name: edge-tts-release
        path: edgeapp/build/outputs/apk/release/edgeapp-release.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: '**/build/reports/tests/'
        retention-days: 14

    - name: Upload Release APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: release-arm64-v8a
        path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
        retention-days: 30

    - name: Upload Release APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: release-armeabi-v7a
        path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
        retention-days: 30

    - name: Upload Release APK (universal)
      uses: actions/upload-artifact@v4
      with:
        name: release-universal
        path: app/build/outputs/apk/release/app-universal-release.apk
        retention-days: 30

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          app/build/outputs/apk/release/app-arm64-v8a-release.apk
          app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          app/build/outputs/apk/release/app-universal-release.apk
          edgeapp/build/outputs/apk/release/edgeapp-release.apk

  edge-device-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
    - name: Enable emulator acceleration
      run: sudo chmod 666 /dev/kvm
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Verify Edge system TTS and MP3 decoding on Android
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        arch: x86_64
        disable-animations: true
        script: |
          ./gradlew :edgeapp:connectedDebugAndroidTest --no-daemon
          mkdir -p edgeapp/build/reports/ui
          adb pull /data/local/tmp/edge-ui-preview/. edgeapp/build/reports/ui/
          test "$(find edgeapp/build/reports/ui -name 'edge-*.png' | wc -l)" -eq 7
    - name: Upload Edge UI previews
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: edge-ui-preview
        path: edgeapp/build/reports/ui/**/*.png
        if-no-files-found: error
        retention-days: 14
    - name: Upload device test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: edge-device-test-reports
        path: edgeapp/build/reports/androidTests/
        retention-days: 14
